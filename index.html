<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Samovar Ultra</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="title">🍶 Samovar Ultra</div>

  <div class="card">
    <div class="balance" id="balance">0</div>
    <div class="income" id="income">+1 / сек</div>
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="samovar">
    <div class="level" id="level">Уровень 1</div>
    <div class="samovar-emoji" id="samovar">🔥</div>
  </div>

  <button class="btn collect" id="collect-btn" onclick="collect()">
    ☕ Собрать — <span id="collect-reward">+1</span>
  </button>
  <button class="btn upgrade" id="upgrade-btn" onclick="upgrade()">
    ⬆️ Улучшить — <span id="upgrade-cost">50 монет</span>
  </button>
  <button class="btn boost" id="boost-btn" onclick="activateBoost()">
    🔥 Буст x2 (10с) — <span id="boost-cost">200 монет</span>
  </button>

  <div class="stats">
    <div>Тапы: <span id="taps">0</span></div>
    <div>Уровень: <span id="stat-level">1</span></div>
    <div>За тап: <span id="per-tap">1</span></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
