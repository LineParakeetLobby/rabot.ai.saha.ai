<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samovar Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="title">☕ Samovar Clicker</div>

    <div class="card">
      <div class="balance" id="balance">0</div>
      <div class="income" id="income">+0 / sec</div>
      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <div class="samovar">
      <div class="level" id="level">Level 1</div>
      <div class="samovar-emoji" id="samovar">🫖</div>
    </div>

    <button class="btn collect" id="collect-btn" onclick="collect()">
      ☕ Collect Tea — <span id="collect-reward">+1</span>
    </button>
    <button class="btn upgrade" id="upgrade-btn" onclick="upgrade()">
      ⬆️ Upgrade — <span id="upgrade-cost">Cost: 50</span>
    </button>
    <button class="btn boost" id="boost-btn" onclick="activateBoost()">
      🔥 Boost x2 (10s) — <span id="boost-cost">Cost: 200</span>
    </button>

    <div class="stats">
      <div>Taps: <span id="taps">0</span></div>
      <div>Level: <span id="stat-level">1</span></div>
      <div>Per tap: <span id="per-tap">1</span></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
